# Benchtop on a lab server, with HTTPS (automatic certificates from Let's Encrypt via Caddy).
# See docs/SERVER.md for the step-by-step guide.
#
#   cp deploy/server.env.example deploy/.env      # then edit deploy/.env
#   docker compose -f deploy/docker-compose.server.yml --env-file deploy/.env up -d --build
#
# Benchtop uses its standard database (SQLite) here, exactly as on a Mac, so the built-in backups work:
# a daily backup into BENCHTOP_BACKUP_HOST_DIR (attached files kept once), a second copy (choose it in
# Admin → Backups), and a weekly restore test. (docker-compose.server-postgres.yml is the advanced
# alternative, without built-in backups.)
services:
  app:
    build: ..
    environment:
      BENCHTOP_PUBLIC_URL: https://${BENCHTOP_DOMAIN}
      BENCHTOP_ADMIN_USER: admin
      BENCHTOP_ADMIN_PASSWORD: ${BENCHTOP_ADMIN_PASSWORD}
      BENCHTOP_SECRET_KEY: ${BENCHTOP_SECRET_KEY}
      BENCHTOP_TOKEN_TTL_HOURS: ${BENCHTOP_TOKEN_TTL_HOURS:-12}
      BENCHTOP_BACKUP_DIR: /backups
      BENCHTOP_OIDC_ISSUER: ${BENCHTOP_OIDC_ISSUER:-}
      BENCHTOP_OIDC_CLIENT_ID: ${BENCHTOP_OIDC_CLIENT_ID:-}
      BENCHTOP_OIDC_CLIENT_SECRET: ${BENCHTOP_OIDC_CLIENT_SECRET:-}
      BENCHTOP_OIDC_NAME: ${BENCHTOP_OIDC_NAME:-}
      BENCHTOP_OIDC_ALLOWED_DOMAINS: ${BENCHTOP_OIDC_ALLOWED_DOMAINS:-}
      BENCHTOP_OIDC_AUTO_CREATE: ${BENCHTOP_OIDC_AUTO_CREATE:-on}
      BENCHTOP_PASSWORD_LOGIN: ${BENCHTOP_PASSWORD_LOGIN:-on}
      # A server set up before 0.18.2 kept its records in Postgres. If deploy/.env still has POSTGRES_PASSWORD,
      # Benchtop refuses to start on an empty database here rather than look as if the records were gone.
      BENCHTOP_LEGACY_POSTGRES: ${POSTGRES_PASSWORD:-}
    volumes:
      - benchtop-data:/data                                         # the database and attached files
      - ${BENCHTOP_BACKUP_HOST_DIR:-./backups}:/backups             # daily backups, on the host
      - ${BENCHTOP_BACKUP_COPY_HOST_DIR:-./backup-copy}:/backup-copy  # the second copy: choose /backup-copy in Admin → Backups
      # instrument folders (Admin → Instruments), mounted read-only; see docs/SERVER.md
      # - /mnt/instruments:/instruments:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      BENCHTOP_DOMAIN: ${BENCHTOP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    restart: unless-stopped

volumes:
  benchtop-data:
  caddy-data:
  caddy-config:
