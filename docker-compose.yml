# Default: one container, SQLite in a named volume.
#   docker compose up -d --build
#   docker compose exec app python -m app.seed      # optional demo data
#
# For a lab server people share, use deploy/docker-compose.server.yml (HTTPS, backups): see docs/SERVER.md.
# Postgres (below) is for very large installations only: Benchtop's built-in backups don't cover it.
#   docker compose --profile postgres up -d --build    and uncomment BENCHTOP_DATABASE_URL
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      BENCHTOP_ADMIN_USER: admin
      BENCHTOP_ADMIN_PASSWORD: ${BENCHTOP_ADMIN_PASSWORD:-change-me-now}
      # BENCHTOP_DATABASE_URL: postgresql+psycopg://benchtop:benchtop@db:5432/benchtop
    volumes: ["benchtop-data:/data"]
    restart: unless-stopped

  db:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: benchtop
      POSTGRES_PASSWORD: benchtop
      POSTGRES_DB: benchtop
    volumes: ["benchtop-pg:/var/lib/postgresql/data"]
    restart: unless-stopped

volumes:
  benchtop-data:
  benchtop-pg:
